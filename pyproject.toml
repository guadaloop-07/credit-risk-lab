[project]
name = "credit-risk-lab"
version = "0.1.0"
description = "Laboratorio reproducible de estrés de morosidad del crédito al consumo en México."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Guadalupe Castillo Solano" },
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2",
    "pre-commit>=4.6.1,<5",
    "pytest>=9,<10",
    "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/riesgo_crediticio"]

[tool.ruff]
target-version = "py312"
line-length = 88
force-exclude = true
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
